[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
dynamic = ["version"]
description = "Core maze generation module from A-MAZE-ING pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "adaza-ru", email = "adaza-ru@student.42malaga.com" },
    { name = "jabad-di", email = "jabad-di@student.42malaga.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.dynamic]
version = { attr = "mazegen.generator.__version__" }

[tool.setuptools]
packages = ["mazegen"]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
strict = true
mypy_path = "typings"
exclude = [
    "\\.venv",
    "\\.mypy_cache",
    "\\.pytest_cache",
    "build",
    "dist"
]